name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore Mxc.GitHubRunner.slnx --locked-mode
      - name: Test
        run: dotnet test Mxc.GitHubRunner.slnx -c Release --no-restore --logger trx --results-directory TestResults
      - name: Publish framework-dependent Windows CLI
        run: dotnet publish src/Mxc.GitHubRunner -c Release --no-restore -o artifacts/publish
      - name: Bundle verified native Git and usage documentation
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mingit-busybox.zip'
          Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-busybox-64-bit.zip' -OutFile $archive
          $expected = 'a8a9172a6747926648b78a3411f3b94813dd22da8a8ec5dbe61122bc414edd63'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'MinGit BusyBox SHA-256 mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath artifacts/publish/tools/MinGitBusyBox
          Copy-Item -LiteralPath README.md,LICENSE,THIRD_PARTY_NOTICES.md -Destination artifacts/publish/
          Copy-Item -LiteralPath docs,examples -Destination artifacts/publish/ -Recurse
      - uses: actions/upload-artifact@v7
        with:
          name: mxc-gh-runner-windows
          path: artifacts/publish/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
